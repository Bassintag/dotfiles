general {
  hide_cursor = true
}

background {
  path = ~/wallpaper.png
  blur_passes = 2
  blur_size = 7
}

input-field {
  size = 512, 48
  font_family = Noto Sans
  dots_size = 0.25
  outline_thickness = 2
  outer_color = rgba(46, 52, 64, 0.5)
  inner_color = rgba(76, 86, 106, 0.5)
  font_color = rgb(216, 222, 233)
  rounding = 4
}